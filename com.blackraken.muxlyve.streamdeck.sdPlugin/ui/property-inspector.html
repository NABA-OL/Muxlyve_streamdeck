<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxlyve Property Inspector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #e6edf3;
            background: #0d1117;
            padding: 12px;
        }

        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }

        select,
        input {
            width: 100%;
            margin-top: 4px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #2a3140;
            background: #161b22;
            color: #e6edf3;
        }

        .hint {
            font-size: 11px;
            color: #8b949e;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <label for="platform">Plataforma</label>
    <select id="platform">
        <option value="twitch">Twitch</option>
        <option value="youtube">YouTube</option>
        <option value="kick">Kick</option>
        <option value="tiktok">TikTok</option>
    </select>

    <label for="panelHost">Host del panel</label>
    <input id="panelHost" type="text" placeholder="127.0.0.1" />
    <div class="hint">IP o hostname de la máquina que corre Muxlyve. Dejalo vacío si corre en esta misma máquina.</div>

    <label for="panelPort">Puerto del panel</label>
    <input id="panelPort" type="number" value="19080" min="1" max="65535" />
    <div class="hint">El plugin usa este host y puerto para contactar la API de Muxlyve.</div>

    <label for="panelToken">Token del panel</label>
    <input id="panelToken" type="password" placeholder="Solo necesario si Muxlyve corre en otra máquina" />
    <div class="hint">Copialo desde Muxlyve → Ajustes → Conexión Stream Deck. Requerido cuando "Allow LAN Panel" está activo.</div>

    <script>
        const platform = document.getElementById('platform');
        const panelHost = document.getElementById('panelHost');
        const panelPort = document.getElementById('panelPort');
        const panelToken = document.getElementById('panelToken');

        let websocket;
        let uuid;

        function platformFromActionUUID(actionUUID) {
            if (!actionUUID) return null;
            const platformId = actionUUID.split('.').pop();
            return ['twitch', 'youtube', 'kick', 'tiktok'].includes(platformId) ? platformId : null;
        }

        function applySettingsToForm(settings) {
            if (settings?.platform) platform.value = settings.platform;
            if (settings?.panelHost) panelHost.value = settings.panelHost;
            if (settings?.panelPort) panelPort.value = settings.panelPort;
            if (settings?.panelToken) panelToken.value = settings.panelToken;
        }

        function save() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: uuid,
                payload: {
                    platform: platform.value,
                    panelHost: panelHost.value,
                    panelPort: panelPort.value,
                    panelToken: panelToken.value,
                },
            }));
        }

        platform.addEventListener('change', save);
        panelHost.addEventListener('input', save);
        panelPort.addEventListener('input', save);
        panelToken.addEventListener('input', save);

        // eslint-disable-next-line no-unused-vars
        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inUUID;
            const actionInfo = JSON.parse(inActionInfo);

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);

            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                const defaultPlatform = platformFromActionUUID(actionInfo?.action);
                if (defaultPlatform) platform.value = defaultPlatform;
                applySettingsToForm(actionInfo?.payload?.settings);
            };

            websocket.onmessage = (evt) => {
                const message = JSON.parse(evt.data);
                if (message.event === 'didReceiveSettings') {
                    applySettingsToForm(message.payload?.settings);
                }
            };
        }
    </script>
</body>

</html>
