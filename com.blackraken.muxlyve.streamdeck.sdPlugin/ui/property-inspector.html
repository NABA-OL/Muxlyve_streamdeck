<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxlyve Property Inspector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #e6edf3;
            background: #0d1117;
            padding: 12px;
        }

        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }

        select,
        input {
            width: 100%;
            margin-top: 4px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #2a3140;
            background: #161b22;
            color: #e6edf3;
        }

        .hint {
            font-size: 11px;
            color: #8b949e;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <!-- Se añadieron IDs a los labels y hints para poder modificarlos con JS -->
    <label for="platform" id="lbl-platform">Platform</label>
    <select id="platform">
        <option value="twitch">Twitch</option>
        <option value="youtube">YouTube</option>
        <option value="kick">Kick</option>
        <option value="tiktok">TikTok</option>
    </select>

    <label for="panelHost" id="lbl-host">Muxlyve Host</label>
    <input id="panelHost" type="text" placeholder="127.0.0.1" />
    <div class="hint" id="hint-host">IP or hostname of the machine running Muxlyve. Leave empty if running locally.</div>

    <label for="panelPort" id="lbl-port">Muxlyve Port</label>
    <input id="panelPort" type="number" value="19080" min="1" max="65535" />
    <div class="hint" id="hint-port">The plugin uses this host and port to contact the Muxlyve API.</div>

    <label for="panelToken" id="lbl-token">Muxlyve Token</label>
    <input id="panelToken" type="password" id="placeholder-token" placeholder="Only required if Muxlyve runs on another machine" />
    <div class="hint" id="hint-token">Copy it from Muxlyve → Settings → Stream Deck Connection. Required when "Allow LAN Panel" is active.</div>

    <script>
        const platform = document.getElementById('platform');
        const panelHost = document.getElementById('panelHost');
        const panelPort = document.getElementById('panelPort');
        const panelToken = document.getElementById('panelToken');

        let websocket;
        let uuid;

        // DICCIONARIO DE TRADUCCIONES
        const locales = {
            es: {
                lblPlatform: "Plataforma",
                lblHost: "Host de Muxlyve",
                hintHost: "IP o hostname de la máquina que corre Muxlyve. Déjalo vacío si corre en esta misma máquina.",
                lblPort: "Puerto de Muxlyve",
                hintPort: "El plugin usa este host y puerto para contactar la API de Muxlyve.",
                lblToken: "Token de Muxlyve",
                placeholderToken: "Solo necesario si Muxlyve corre en otra máquina",
                hintToken: "Cópialo desde Muxlyve → Ajustes → Conexión Stream Deck. Requerido cuando 'Allow LAN Panel' está activo."
            }
        };

        function platformFromActionUUID(actionUUID) {
            if (!actionUUID) return null;
            const platformId = actionUUID.split('.').pop();
            return ['twitch', 'youtube', 'kick', 'tiktok'].includes(platformId) ? platformId : null;
        }

        function applySettingsToForm(settings) {
            if (settings?.platform) platform.value = settings.platform;
            if (settings?.panelHost) panelHost.value = settings.panelHost;
            if (settings?.panelPort) panelPort.value = settings.panelPort;
            if (settings?.panelToken) panelToken.value = settings.panelToken;
        }

        function save() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: uuid,
                payload: {
                    platform: platform.value,
                    panelHost: panelHost.value,
                    panelPort: panelPort.value,
                    panelToken: panelToken.value,
                },
            }));
        }

        platform.addEventListener('change', save);
        panelHost.addEventListener('input', save);
        panelPort.addEventListener('input', save);
        panelToken.addEventListener('input', save);

        // eslint-disable-next-line no-unused-vars
        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inUUID;
            const actionInfo = JSON.parse(inActionInfo);
            
            // --- LÓGICA DE TRADUCCIÓN ---
            const info = JSON.parse(inInfo);
            const appLanguage = info.application.language; // Detecta el idioma de Stream Deck
            
            if (appLanguage === 'es' && locales.es) {
                const t = locales.es;
                document.getElementById('lbl-platform').innerText = t.lblPlatform;
                document.getElementById('lbl-host').innerText = t.lblHost;
                document.getElementById('hint-host').innerText = t.hintHost;
                document.getElementById('lbl-port').innerText = t.lblPort;
                document.getElementById('hint-port').innerText = t.hintPort;
                document.getElementById('lbl-token').innerText = t.lblToken;
                document.getElementById('hint-token').innerText = t.hintToken;
                panelToken.placeholder = t.placeholderToken;
            }
            // ----------------------------

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);

            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                const defaultPlatform = platformFromActionUUID(actionInfo?.action);
                if (defaultPlatform) platform.value = defaultPlatform;
                applySettingsToForm(actionInfo?.payload?.settings);
            };

            websocket.onmessage = (evt) => {
                const message = JSON.parse(evt.data);
                if (message.event === 'didReceiveSettings') {
                    applySettingsToForm(message.payload?.settings);
                }
            };
        }
    </script>
</body>

</html>
