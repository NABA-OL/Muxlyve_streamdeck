<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxlyve Full Recording</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: #e6edf3;
            background: #0d1117;
            padding: 12px;
        }
        label { display: block; margin-top: 8px; font-size: 12px; color: #8b949e; }
        input {
            width: 100%; margin-top: 4px; padding: 6px;
            border-radius: 6px; border: 1px solid #2a3140;
            background: #161b22; color: #e6edf3; box-sizing: border-box;
        }
        .hint { font-size: 11px; color: #8b949e; margin-top: 6px; }
    </style>
</head>
<body>
    <label for="panelHost" id="lbl-host">Muxlyve Host</label>
    <input id="panelHost" type="text" placeholder="127.0.0.1" />
    <div class="hint" id="hint-host">IP or hostname of the machine running Muxlyve.</div>

    <label for="panelPort" id="lbl-port">Muxlyve Port</label>
    <input id="panelPort" type="number" value="19080" min="1" max="65535" />

    <label for="panelToken" id="lbl-token">Muxlyve Token</label>
    <input id="panelToken" type="password" placeholder="Only required if Muxlyve runs on another machine" />
    <div class="hint" id="hint-token">Copy it from Muxlyve → Settings → Stream Deck Connection. Required when "Allow LAN Panel" is active.</div>

    <script>
        const panelHost = document.getElementById('panelHost');
        const panelPort = document.getElementById('panelPort');
        const panelToken = document.getElementById('panelToken');
        let websocket, uuid;

        const locales = {
            es: {
                lblHost: "Host de Muxlyve",
                hintHost: "IP o hostname de la máquina que corre Muxlyve.",
                lblPort: "Puerto de Muxlyve",
                lblToken: "Token de Muxlyve",
                hintToken: "Cópialo desde Muxlyve → Ajustes → Conexión Stream Deck. Requerido cuando 'Allow LAN Panel' está activo."
            }
        };

        function apply(settings) {
            if (settings?.panelHost) panelHost.value = settings.panelHost;
            if (settings?.panelPort) panelPort.value = settings.panelPort;
            if (settings?.panelToken) panelToken.value = settings.panelToken;
        }

        function save() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            websocket.send(JSON.stringify({
                event: 'setSettings', context: uuid,
                payload: { panelHost: panelHost.value, panelPort: panelPort.value, panelToken: panelToken.value },
            }));
        }

        panelHost.addEventListener('input', save);
        panelPort.addEventListener('input', save);
        panelToken.addEventListener('input', save);

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inUUID;
            const actionInfo = JSON.parse(inActionInfo);

            const info = JSON.parse(inInfo);
            const appLanguage = info.application.language;

            if (appLanguage === 'es' && locales.es) {
                const t = locales.es;
                document.getElementById('lbl-host').innerText = t.lblHost;
                document.getElementById('hint-host').innerText = t.hintHost;
                document.getElementById('lbl-port').innerText = t.lblPort;
                document.getElementById('lbl-token').innerText = t.lblToken;
                document.getElementById('hint-token').innerText = t.hintToken;
            }

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                apply(actionInfo?.payload?.settings);
            };
            websocket.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.event === 'didReceiveSettings') apply(msg.payload?.settings);
            };
        }
    </script>
</body>
</html>
