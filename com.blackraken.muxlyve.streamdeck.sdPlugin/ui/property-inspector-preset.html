<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxlyve Preset</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: #e6edf3;
            background: #0d1117;
            padding: 12px;
        }
        label { display: block; margin-top: 8px; font-size: 12px; color: #8b949e; }
        select, input {
            width: 100%; margin-top: 4px; padding: 6px;
            border-radius: 6px; border: 1px solid #2a3140;
            background: #161b22; color: #e6edf3; box-sizing: border-box;
        }
        select { cursor: pointer; }
        .hint { font-size: 11px; color: #8b949e; margin-top: 6px; }
        .hint.error { color: #f85149; }
    </style>
</head>
<body>
    <label for="presetName" id="lbl-preset">Perfil</label>
    <select id="presetName">
        <option value="">Cargando...</option>
    </select>
    <div class="hint" id="hint-preset">Los perfiles se crean desde el panel de Muxlyve (sección Conexiones → Perfiles).</div>

    <label for="panelHost" id="lbl-host">Muxlyve Host</label>
    <input id="panelHost" type="text" placeholder="127.0.0.1" />
    <div class="hint" id="hint-host">IP or hostname of the machine running Muxlyve.</div>

    <label for="panelPort" id="lbl-port">Muxlyve Port</label>
    <input id="panelPort" type="number" value="19080" min="1" max="65535" />

    <label for="panelToken" id="lbl-token">Muxlyve Token</label>
    <input id="panelToken" type="password" placeholder="Only required if Muxlyve runs on another machine" />
    <div class="hint" id="hint-token">Copy it from Muxlyve → Settings → Stream Deck Connection. Required when "Allow LAN Panel" is active.</div>

    <script>
        const presetName = document.getElementById('presetName');
        const hintPreset = document.getElementById('hint-preset');
        const panelHost = document.getElementById('panelHost');
        const panelPort = document.getElementById('panelPort');
        const panelToken = document.getElementById('panelToken');
        let websocket, uuid, actionUUID;
        let pendingPresetName;

        const locales = {
            es: {
                lblPreset: "Perfil",
                hintPreset: "Los perfiles se crean desde el panel de Muxlyve (sección Conexiones → Perfiles).",
                lblHost: "Host de Muxlyve",
                hintHost: "IP o hostname de la máquina que corre Muxlyve.",
                lblPort: "Puerto de Muxlyve",
                lblToken: "Token de Muxlyve",
                hintToken: "Cópialo desde Muxlyve → Ajustes → Conexión Stream Deck. Requerido cuando 'Allow LAN Panel' está activo.",
                empty: "Abrí Muxlyve y creá al menos un perfil primero",
                offline: "No se pudo conectar con Muxlyve",
            }
        };
        let t = null;

        function fillPresets(presets, error) {
            presetName.innerHTML = '';
            if (error) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = t ? t.offline : 'Could not connect to Muxlyve';
                presetName.appendChild(opt);
                hintPreset.textContent = error;
                hintPreset.classList.add('error');
                return;
            }

            hintPreset.classList.remove('error');
            hintPreset.textContent = t ? t.hintPreset : 'Presets are created from the Muxlyve panel (Connections → Presets).';

            if (!presets || presets.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = t ? t.empty : 'Open Muxlyve and create at least one preset first';
                presetName.appendChild(opt);
                return;
            }

            for (const preset of presets) {
                const opt = document.createElement('option');
                opt.value = preset.name;
                opt.textContent = preset.name;
                presetName.appendChild(opt);
            }

            const wanted = pendingPresetName ?? presetName.value;
            if (wanted && presets.some((preset) => preset.name === wanted)) {
                presetName.value = wanted;
            }
            pendingPresetName = undefined;
        }

        function apply(settings) {
            if (settings?.panelHost) panelHost.value = settings.panelHost;
            if (settings?.panelPort) panelPort.value = settings.panelPort;
            if (settings?.panelToken) panelToken.value = settings.panelToken;
            if (settings?.presetName) pendingPresetName = settings.presetName;
        }

        function save() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            websocket.send(JSON.stringify({
                event: 'setSettings', context: uuid,
                payload: {
                    presetName: presetName.value,
                    panelHost: panelHost.value,
                    panelPort: panelPort.value,
                    panelToken: panelToken.value,
                },
            }));
        }

        function requestPresets() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            websocket.send(JSON.stringify({
                event: 'sendToPlugin', action: actionUUID, context: uuid,
                payload: { cmd: 'listPresets' },
            }));
        }

        presetName.addEventListener('change', save);
        panelHost.addEventListener('input', save);
        panelPort.addEventListener('input', () => { save(); requestPresets(); });
        panelToken.addEventListener('input', () => { save(); requestPresets(); });
        panelHost.addEventListener('change', requestPresets);

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inUUID;
            const actionInfo = JSON.parse(inActionInfo);
            actionUUID = actionInfo.action;

            const info = JSON.parse(inInfo);
            if (info.application.language === 'es') {
                t = locales.es;
                document.getElementById('lbl-preset').innerText = t.lblPreset;
                document.getElementById('lbl-host').innerText = t.lblHost;
                document.getElementById('hint-host').innerText = t.hintHost;
                document.getElementById('lbl-port').innerText = t.lblPort;
                document.getElementById('lbl-token').innerText = t.lblToken;
                document.getElementById('hint-token').innerText = t.hintToken;
            }

            websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                apply(actionInfo?.payload?.settings);
                requestPresets();
            };
            websocket.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.event === 'didReceiveSettings') {
                    apply(msg.payload?.settings);
                } else if (msg.event === 'sendToPropertyInspector') {
                    fillPresets(msg.payload?.presets, msg.payload?.error);
                }
            };
        }
    </script>
</body>
</html>
